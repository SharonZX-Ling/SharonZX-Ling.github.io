<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZiXun Ling · Portfolio</title>
  <meta name="description" content="ZiXun Ling 的个人作品集 — 市场营销 · 内容策划 · 品牌运营" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='28' fill='%23C9A96E'/><text x='32' y='42' text-anchor='middle' font-size='32' font-family='Arial' fill='white' font-weight='bold'>Z</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=20260814" />
</head>
<body>

  <!-- ===== 浮动导航 (桌面端) ===== -->
  <nav class="nav-float" id="navFloat">
    <a href="#hero" class="nav-dot active" data-target="hero" aria-label="Home"></a>
    <a href="#about" class="nav-dot" data-target="about" aria-label="About"></a>
    <a href="#internship" class="nav-dot" data-target="internship" aria-label="Internship"></a>
    <a href="#projects" class="nav-dot" data-target="projects" aria-label="Projects"></a>
    <a href="#others" class="nav-dot" data-target="others" aria-label="Others"></a>
    <a href="#contact" class="nav-dot" data-target="contact" aria-label="Contact"></a>
  </nav>

  <!-- ===== 移动端顶部导航栏 ===== -->
  <nav class="nav-mobile" id="navMobile">
    <div class="nav-mobile-bar">
      <a href="#hero" class="nav-mobile-logo" data-target="hero">ZL</a>
      <button class="nav-mobile-toggle" id="navMobileToggle" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
    <div class="nav-mobile-menu" id="navMobileMenu">
      <a href="#about" data-target="about">About</a>
      <a href="#internship" data-target="internship">Internship</a>
      <a href="#projects" data-target="projects">Projects</a>
      <a href="#others" data-target="others">Others</a>
      <a href="#contact" data-target="contact">Contact</a>
    </div>
  </nav>

    <!-- ===== HERO 图片网格 ===== -->
  <section id="hero" class="hero">
    <div class="hero-grid" id="heroGrid">
      <!-- 8 张图片，4col × 3row editorial 布局，无空缺 -->
      <div class="grid-item gi-1" style="background-image:url('assets/images/hero_1.jpg'); background-size:cover; background-position:center;"></div>
      <div class="grid-item gi-2" style="background-image:url('assets/images/hero_2.jpg'); background-size:cover; background-position:center;"></div>
      <div class="grid-item gi-3" style="background-image:url('assets/images/hero_6.jpg'); background-size:cover; background-position:center;"></div>
      <div class="grid-item gi-4" style="background-image:url('assets/images/hero_4.jpg'); background-size:cover; background-position:center;"></div>
      <div class="grid-item gi-5" style="background-image:url('assets/images/hero_5.jpg'); background-size:cover; background-position:center;"></div>
      <div class="grid-item gi-6" style="background-image:url('assets/images/hero_3.jpg'); background-size:cover; background-position:center;"></div>
      <div class="grid-item gi-7" style="background-image:url('assets/images/hero_7.jpg'); background-size:cover; background-position:center;"></div>
      <div class="grid-item gi-8" style="background-image:url('assets/images/hero_8.jpg'); background-size:cover; background-position:center;"></div>
    </div>

    <!-- Hero overlay: name + role -->
    <div class="hero-overlay" id="heroOverlay">
      <p class="hero-role">Marketing · Content · Brand</p>
      <h1 class="hero-name">凌子洵</h1>
      <p class="hero-name-en">ZiXun Ling</p>
      <p class="hero-tagline">探索品牌与用户之间的连接</p>
      <div class="hero-scroll">
        <span>Scroll</span>
        <div class="scroll-line"></div>
      </div>
    </div>
  </section>

  <!-- ===== About ===== -->
  <section id="about" class="section">
    <div class="section-inner">
      <div class="section-label">01</div>
      <h2 class="section-title">About</h2>
      <div class="about-layout">
        <div class="about-text">
          <p class="about-lead"></p>
          <div class="about-tags"></div>
        </div>
        <div class="about-sidebar"></div>
      </div>
    </div>
  </section>

  <!-- ===== Internship ===== -->
  <section id="internship" class="section">
    <div class="section-inner">
      <div class="section-label">02</div>
      <h2 class="section-title">Internship</h2>
      <p class="section-sub"></p>

      <div class="case-gallery" id="caseGallery"></div>
    </div>
  </section>

  <!-- ===== Projects ===== -->
  <section id="projects" class="section">
    <div class="section-inner">
      <div class="section-label">03</div>
      <h2 class="section-title">Projects</h2>
      <p class="section-sub"></p>

      <div class="project-grid"></div>
    </div>
  </section>

  <!-- ===== Others ===== -->
  <section id="others" class="section">
    <div class="section-inner">
      <div class="section-label">04</div>
      <h2 class="section-title">Others</h2>
      <p class="section-sub"></p>

      <div class="welfare-story" id="welfareStory"></div>
    </div>
  </section>

  <!-- ===== Contact ===== -->
  <section id="contact" class="section section-contact">
    <div class="section-inner">
      <div class="section-label">05</div>
      <h2 class="section-title">Contact</h2>
      <p class="section-sub"></p>

      <div class="contact-list"></div>

      <footer class="site-footer">
        <p></p>
      </footer>
    </div>
  </section>

  <!-- ===== 项目详情 Overlay ===== -->
  <div class="detail-overlay" id="detailOverlay" aria-hidden="true">
    <button class="detail-close" id="detailClose" aria-label="Close">← Back</button>
    <div class="detail-body" id="detailBody"></div>
  </div>

  <!-- ===== 加载遮罩 ===== -->
  <div class="loader" id="loader">
    <div class="loader-text">ZiXun Ling</div>
    <div class="loader-bar"><div class="loader-progress" id="loaderProgress"></div></div>
  </div>

  <script src="js/main.js?v=20260814"></script>
</body>
</html>
